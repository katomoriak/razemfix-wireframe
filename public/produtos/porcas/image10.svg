<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="zincGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="nylonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="300" height="240" rx="12" fill="url(#bgGrad)"/>

  <!-- Standard Low Nyloc Nut -->
  <g filter="url(#shadow)" transform="translate(150, 120)">
    <polygon points="-55,10 0,45 0,-15 -55,-50" fill="url(#zincGrad)"/>
    <polygon points="0,45 55,10 55,-50 0,-15" fill="#64748b"/>
    <polygon points="0,-65 55,-50 0,-15 -55,-50" fill="#f1f5f9"/>

    <!-- Blue Nylon Collar -->
    <ellipse cx="0" cy="-50" rx="34" ry="17" fill="url(#nylonBlue)"/>
    <ellipse cx="0" cy="-50" rx="34" ry="17" stroke="#0284c7" stroke-width="1.5" fill="none"/>
    <ellipse cx="0" cy="-50" rx="22" ry="11" fill="#0f172a"/>
  </g>

  <rect x="15" y="15" width="80" height="20" rx="4" fill="#0284c7" opacity="0.9"/>
  <text x="55" y="29" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">DIN 985</text>
</svg>
