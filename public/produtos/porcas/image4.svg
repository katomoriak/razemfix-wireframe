<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="darkSteelFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="50%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="darkSteelTop" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="darkSteelSide" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="50%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <radialGradient id="holeShadow" cx="50%" cy="50%" r="50%">
      <stop offset="70%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#334155"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="300" height="240" rx="12" fill="url(#bgGrad)"/>
  
  <!-- Main Heavy Hex Nut ASTM A563 (3D Isometric view) -->
  <g filter="url(#shadow)" transform="translate(150, 115)">
    <!-- Base Shadow -->
    <ellipse cx="0" cy="55" rx="65" ry="18" fill="#0f172a" opacity="0.2"/>

    <!-- Front Left Face -->
    <polygon points="-65,10 0,45 0,-15 -65,-45" fill="url(#darkSteelFace)"/>
    
    <!-- Front Right Face -->
    <polygon points="0,45 65,10 65,-45 0,-15" fill="url(#darkSteelSide)"/>

    <!-- Top Hex Face -->
    <polygon points="0,-70 65,-45 65,-45 0,-15 -65,-45" fill="url(#darkSteelTop)"/>
    <polygon points="0,-68 60,-44 0,-18 -60,-44" fill="#64748b" opacity="0.3"/>

    <!-- Inner Thread Hole (Top view perspective) -->
    <ellipse cx="0" cy="-44" rx="28" ry="14" fill="url(#holeShadow)"/>
    <ellipse cx="0" cy="-44" rx="28" ry="14" stroke="#94a3b8" stroke-width="1.5" fill="none" opacity="0.6"/>
    <ellipse cx="0" cy="-44" rx="22" ry="11" stroke="#cbd5e1" stroke-width="1" stroke-dasharray="3,2" fill="none" opacity="0.5"/>

    <!-- Stamped Marking A563 -->
    <text x="-18" y="-50" font-family="monospace" font-weight="bold" font-size="7" fill="#cbd5e1" opacity="0.7" transform="rotate(-12, -18, -50)">A563</text>
  </g>

  <!-- Spec Tag -->
  <rect x="15" y="15" width="85" height="20" rx="4" fill="#1e293b" opacity="0.9"/>
  <text x="57" y="29" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#f8fafc">ASTM A563</text>
</svg>
