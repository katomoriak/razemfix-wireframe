<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="zincGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#64748b"/>
    </linearGradient>
    <linearGradient id="nylonBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="300" height="240" rx="12" fill="url(#bgGrad)"/>

  <g filter="url(#shadow)" transform="translate(150, 120)">
    <!-- Wide Flange Base -->
    <ellipse cx="0" cy="35" rx="75" ry="24" fill="url(#zincGrad)"/>
    <ellipse cx="0" cy="30" rx="75" ry="24" fill="#f1f5f9"/>

    <!-- Hex Body -->
    <polygon points="-48,0 0,30 0,-25 -48,-55" fill="url(#zincGrad)"/>
    <polygon points="0,30 48,0 48,-55 0,-25" fill="#64748b"/>
    <polygon points="0,-75 48,-55 0,-25 -48,-55" fill="#cbd5e1"/>

    <!-- Blue Nylon Ring Collar on Top -->
    <ellipse cx="0" cy="-60" rx="28" ry="14" fill="url(#nylonBlue)"/>
    <ellipse cx="0" cy="-60" rx="28" ry="14" stroke="#0369a1" stroke-width="1.5" fill="none"/>
    <ellipse cx="0" cy="-60" rx="20" ry="10" fill="#0f172a"/>
  </g>

  <rect x="15" y="15" width="85" height="20" rx="4" fill="#0284c7" opacity="0.9"/>
  <text x="57" y="29" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">DIN 6926</text>
</svg>
