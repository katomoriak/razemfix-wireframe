<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="zincGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#cbd5e1"/>
      <stop offset="50%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="300" height="240" rx="12" fill="url(#bgGrad)"/>

  <!-- View showing the bottom serrations on the flange -->
  <g filter="url(#shadow)" transform="translate(150, 115)">
    <!-- Base Flange showing underside serrations -->
    <ellipse cx="0" cy="20" rx="80" ry="30" fill="url(#zincGrad)"/>
    <ellipse cx="0" cy="12" rx="80" ry="30" fill="#f1f5f9"/>

    <!-- Serration notches around rim -->
    <path d="M-75,12 L-65,22 M-50,28 L-40,38 M-20,32 L-10,42 M10,32 L20,42 M40,28 L50,38 M65,12 L75,22 M-70,-2 L-60,8 M70,-2 L60,8" stroke="#334155" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Inner Hex Body raised -->
    <polygon points="-45,-20 0,10 0,-40 -45,-70" fill="#94a3b8"/>
    <polygon points="0,10 45,-20 45,-70 0,-40" fill="#475569"/>
    <polygon points="0,-85 45,-70 0,-40 -45,-70" fill="#e2e8f0"/>

    <!-- Thread Hole -->
    <ellipse cx="0" cy="-62" rx="22" ry="11" fill="#0f172a"/>
  </g>

  <rect x="15" y="15" width="115" height="20" rx="4" fill="#d97706" opacity="0.9"/>
  <text x="72" y="29" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">DIN 6923 SERRILHADA</text>
</svg>
