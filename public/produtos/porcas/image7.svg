<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="steelDark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#334155"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.25"/>
    </filter>
  </defs>

  <rect width="300" height="240" rx="12" fill="url(#bgGrad)"/>

  <g filter="url(#shadow)" transform="translate(150, 120)">
    <!-- Base Hex Nut -->
    <polygon points="-60,15 0,50 0,-15 -60,-50" fill="url(#steelDark)"/>
    <polygon points="0,50 60,15 60,-50 0,-15" fill="#1e293b"/>
    <polygon points="0,-75 60,-50 0,-15 -60,-50" fill="#475569"/>

    <!-- Crimped / Deformed top lock indentations -->
    <path d="M-25,-52 Q-20,-48 -15,-52" stroke="#0f172a" stroke-width="3" fill="none"/>
    <path d="M15,-52 Q20,-48 25,-52" stroke="#0f172a" stroke-width="3" fill="none"/>
    <path d="M-5,-62 Q0,-58 5,-62" stroke="#0f172a" stroke-width="3" fill="none"/>

    <!-- Thread Hole with deformed locking threads -->
    <ellipse cx="0" cy="-45" rx="26" ry="13" fill="#0f172a"/>
    <ellipse cx="0" cy="-45" rx="26" ry="13" stroke="#94a3b8" stroke-width="1.5" fill="none"/>
  </g>

  <rect x="15" y="15" width="75" height="20" rx="4" fill="#475569" opacity="0.9"/>
  <text x="52" y="29" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">IFI-100</text>
</svg>
