<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="wingMetal" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f1f5f9"/>
      <stop offset="50%" stop-color="#94a3b8"/>
      <stop offset="100%" stop-color="#475569"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="300" height="240" rx="12" fill="url(#bgGrad)"/>

  <!-- Wing Nut (DIN 315) -->
  <g filter="url(#shadow)" transform="translate(150, 125)">
    <!-- Left Wing -->
    <path d="M-15,10 C-35,5 -75,-15 -75,-45 C-75,-65 -50,-60 -30,-35 C-20,-20 -15,0 -15,10 Z" fill="url(#wingMetal)"/>
    <path d="M-15,10 C-35,5 -75,-15 -75,-45 C-75,-65 -50,-60 -30,-35 Z" stroke="#cbd5e1" stroke-width="1" fill="none"/>

    <!-- Right Wing -->
    <path d="M15,10 C35,5 75,-15 75,-45 C75,-65 50,-60 30,-35 C20,-20 15,0 15,10 Z" fill="url(#wingMetal)"/>
    <path d="M15,10 C35,5 75,-15 75,-45 C75,-65 50,-60 30,-35 Z" stroke="#475569" stroke-width="1" fill="none"/>

    <!-- Center Boss / Threaded Collar -->
    <ellipse cx="0" cy="15" rx="22" ry="12" fill="#64748b"/>
    <ellipse cx="0" cy="8" rx="22" ry="12" fill="#e2e8f0"/>
    <ellipse cx="0" cy="8" rx="14" ry="7" fill="#0f172a"/>
  </g>

  <rect x="15" y="15" width="80" height="20" rx="4" fill="#059669" opacity="0.9"/>
  <text x="55" y="29" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">DIN 315</text>
</svg>
