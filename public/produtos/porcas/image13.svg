<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 240" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#e2e8f0"/>
    </linearGradient>
    <linearGradient id="tallHexLeft" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e2e8f0"/>
      <stop offset="100%" stop-color="#94a3b8"/>
    </linearGradient>
    <linearGradient id="tallHexRight" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.2"/>
    </filter>
  </defs>

  <rect width="300" height="240" rx="12" fill="url(#bgGrad)"/>

  <!-- Elongated Hex Coupling Nut -->
  <g filter="url(#shadow)" transform="translate(150, 115)">
    <!-- Left Face -->
    <polygon points="-40,65 0,85 0,-45 -40,-65" fill="url(#tallHexLeft)"/>
    <!-- Right Face -->
    <polygon points="0,85 40,65 40,-45 0,-45" fill="url(#tallHexRight)"/>
    <!-- Top Face -->
    <polygon points="0,-85 40,-65 0,-45 -40,-65" fill="#f1f5f9"/>

    <!-- Hole -->
    <ellipse cx="0" cy="-65" rx="20" ry="10" fill="#0f172a"/>
  </g>

  <rect x="15" y="15" width="115" height="20" rx="4" fill="#475569" opacity="0.9"/>
  <text x="72" y="29" text-anchor="middle" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff">PORCA ACOPLAMENTO</text>
</svg>
